# .orchestra/orchestra.conf —— 模型档位。整套编排里【唯一】需要随新模型改的地方。
#
# 写法 `: "${X:=默认值}"` 的意思：环境变量已设置就以环境变量为准，否则用默认值。
# 所以临时换档不用改文件：  CODEX_REVIEW_EFFORT=xhigh bash .orchestra/bin/codex-review run
# T3 Code 的 delegate_task 路径没有 shell，请照本表手填 target（见各 skill 的「T3 路径」）。
#
# 取值来源：模型名取自文章（GPT-6.2 Astra / GPT-6.2 Sol / Gemini 4 Neon）。
# codex 的 gpt-6.2-astra、gpt-6.2-sol 已在本机实测可用；Gemini：T3 通道的 gemini-4-neon 已实测可用，命令行 agy 的名字见 GEMINI_MODEL 注释。

# ── Gemini 顾问（只读；agy-ask 用）────────────────────────────────────
# 两条路，模型 id 不一样：
#   · T3 的 Antigravity 提供方（delegate_task，见 GEMINI_T3_*）：目录里有 gemini-4-neon，已在本机实测可用。本机默认走这条。
#   · 命令行 agy（下面的 GEMINI_MODEL）：本机 `agy models` 列的是 gemini-4-hydrogen-* / gemini-3.8-flash-*，没有 neon，
#     且 agy 的模型 id 带推理档后缀（如 gemini-4-hydrogen-high）；另外本机的 agy 目前被服务端的资格校验拒绝
#     （账号/地区层面的限制，不绕过）。换了机器/账号、命令行能用了，再跑 `bash .orchestra/bin/agy-ask --doctor`，
#     按它的提示把下面改成你账号真能用的 id。
: "${GEMINI_MODEL:=gemini-4-neon}"
: "${GEMINI_EFFORT:=high}"            # agy --effort：low|medium|high|xhigh|max
: "${AGY_MODE:=plan}"                 # agy --mode：plan（只规划不动文件）。改它之前先跑 agy-ask --smoke
: "${AGY_TIMEOUT_SECS:=1800}"
: "${GEMINI_T3_PROVIDER:=antigravity}"  # 仅 T3 路径：delegate_task 的 providerInstanceId
: "${GEMINI_T3_MODEL:=gemini-4-neon}"   # 仅 T3 路径：T3 的 capabilities 里这个名字存在

# ── Codex 干活（codex-worker 用）──────────────────────────────────────
# 文章：写死 GPT-6.2 Astra + xhigh。
: "${CODEX_WORKER_MODEL:=gpt-6.2-astra}"
: "${CODEX_WORKER_EFFORT:=xhigh}"
# 浏览器操控：文章让 GPT-6.2 Sol 去做（浏览器能力来自你 Codex 里已配置的 MCP/插件，脚本只负责选档位）
: "${CODEX_BROWSER_MODEL:=gpt-6.2-sol}"
: "${CODEX_BROWSER_EFFORT:=high}"
: "${CODEX_TIMEOUT_SECS:=3600}"

# ── Codex 审查（codex-review 用）──────────────────────────────────────
# 文章：审查用 GPT-6.2 Sol 性价比最高；推理深度从 xhigh 降到 high，
# 只有碰到钱、权限和登录、对外发消息、往外部系统写数据的文件才继续用 xhigh。
: "${CODEX_REVIEW_MODEL:=gpt-6.2-sol}"
: "${CODEX_REVIEW_EFFORT:=high}"
: "${CODEX_REVIEW_EFFORT_DEEP:=xhigh}"
: "${REVIEW_MAX_ROUNDS:=2}"           # 文章：最多审两轮，过不去交给人决定
: "${REVIEW_MIN_PATH_CHARS:=30}"      # 阻断项的「怎么发生」少于这么多字符 → 自动降为建议（说不出怎么发生就不能拦）
: "${REVIEW_DIFF_CAP_CHARS:=150000}"  # 内嵌进审查提示词的 diff 上限；超出则只给统计，让审查者自己按文件读
: "${REVIEW_TIMEOUT_SECS:=2400}"

# ── 可选：升级给用户时的外部通知 ───────────────────────────────────────
# 设了 ORCH_NOTIFY_CMD 就会把「需要你决定」的摘要从 stdin 喂给它。不设则只在终端打印，由总指挥在对话里向用户提问。
# 飞书自定义机器人（套件自带 bin/notify-feishu；先发卡片、被拒退回纯文本；不支持开了「签名校验」的机器人）：
#   export ORCH_FEISHU_WEBHOOK='https://open.feishu.cn/open-apis/bot/v2/hook/<token>'   # 密钥：别写进仓库
#   export ORCH_NOTIFY_CMD='bash .orchestra/bin/notify-feishu'
#   （传输是固定的，不接受往 curl 里塞任意参数；要绕过代理直连本机的测试服务，设 ORCH_NOTIFY_NOPROXY=1）
